<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>案件板 · The Black Tower</title><script src="owner-entry.js?v=1"></script><link rel="stylesheet" href="caseboard.css?v=6-level"><link rel="stylesheet" href="archive.css?v=1"><link rel="stylesheet" href="./tower-navigation.css?v=2"><link rel="stylesheet" href="map-people.css?v=1"></head>
<body><main class="case-frame"><header><div class="case-brand"><h1>案件板</h1><small>THE BLACK TOWER · 线索与人物</small></div><nav aria-label="案件板工具"><a href="index.html#portal">返回书房</a><a href="map.html">地图桌</a><button id="boardEdit" aria-pressed="false" disabled>编辑模式</button><button id="boardNew" hidden>新建人物</button><button id="boardNewZone" hidden>新建结界</button><button id="boardConnect" aria-pressed="false" hidden>连线</button><select id="boardRegion" aria-label="定位区域"><option value="">定位区域…</option></select><button id="boardFit">全览</button><button id="boardMinus" aria-label="缩小">−</button><button id="boardPlus" aria-label="放大">＋</button><button id="boardFullscreen" aria-pressed="false">全屏</button></nav></header>
<section id="boardViewport" aria-label="可拖动缩放的案件板" tabindex="0" inert><div id="boardWorld"><div id="boardZones"></div><svg id="boardThreads" viewBox="0 0 1800 1200" aria-label="人物间的连线"></svg><div id="boardSeals"></div><div id="boardNodes"></div></div><p id="boardHint" role="status">正在展开案件板…</p></section>
<aside id="boardDetails" hidden aria-label="选中档案"><div class="detail-heading"><button id="boardCloseDetails" aria-label="关闭档案">×</button><small id="boardDetailKind"></small><h2 id="boardDetailTitle"></h2><div id="boardDetailActions"><button id="boardModify" hidden>编辑资料</button><button id="boardStyle" hidden>调整样式</button><button id="boardRemove" hidden>移除</button></div></div><div id="boardDetailBody"></div></aside>
<footer><span>肖像、封签与牵连的细线</span><button data-open-archive data-archive-status>读取最新档案…</button></footer></main>
<dialog id="boardPersonDialog" aria-labelledby="boardPersonHeading"><form id="boardPersonForm"><header><h2 id="boardPersonHeading">新建人物</h2><button type="button" data-close-person aria-label="关闭人物编辑">×</button></header><div class="form-scroll"><label>档案类型<select id="boardKind"><option value="person">人物</option><option value="place">地点</option><option value="group">组织</option></select></label><label>名称<input id="boardName" maxlength="100" required></label><div class="form-pair"><label>种族<input id="boardRace" maxlength="100"></label><label>身份 / 职业<input id="boardRole" maxlength="100"></label></div><label id="boardLevelField">等级<select id="boardLevel"><option value="?">？（未知）</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option></select></label><label>地图地点<select id="boardMapPiece"><option value="">正在读取地点…</option></select></label><label>当前状态<input id="boardStatus" maxlength="100" placeholder="例如：已故、未知、失踪"></label><label>档案备注<textarea id="boardNotes" maxlength="4000" rows="4"></textarea></label><details><summary>肖像资料 · 可稍后补全</summary><p>没有肖像也可以先入档。记下外貌，之后在工作台补全绘制。</p><label>外貌描述<textarea id="boardAppearance" maxlength="2000" rows="3"></textarea></label><label>已绘制的肖像文件<input id="boardPortrait" maxlength="500" placeholder="assets/images/…"></label></details><p id="boardPersonError" role="alert"></p></div><menu><button type="button" data-close-person>取消</button><button type="submit">保存档案</button></menu></form></dialog>
<dialog id="boardEdgeDialog" aria-labelledby="boardEdgeHeading"><form id="boardEdgeForm"><h2 id="boardEdgeHeading">连线备注</h2><p id="boardEdgeNames"></p><label>关系、证词或疑点<textarea id="boardEdgeNote" maxlength="2000" rows="6" placeholder="记录他们之间已知的牵连…"></textarea></label><menu><button type="button" id="boardCancelEdge">取消</button><button type="submit">保存连线</button></menu></form></dialog>
<dialog id="boardZoneDialog" aria-labelledby="boardZoneHeading"><form id="boardZoneForm"><h2 id="boardZoneHeading">结界分组</h2><div class="form-scroll"><label>结界名称<input id="boardZoneName" maxlength="100" required></label><label>微光色调<select id="boardZoneTone"><option value="sage">鼠尾草 · 青绿</option><option value="amber">烛火 · 淡金</option><option value="lilac">秘法 · 灰紫</option></select></label><p>拖动结界标题移动，拖动四角调整范围。结界内的档案保持原位，也可在此精确调整。</p><div class="form-pair"><label>左侧位置<input id="boardZoneX" type="number" step="any" required></label><label>顶部位置<input id="boardZoneY" type="number" step="any" required></label><label>宽度<input id="boardZoneWidth" type="number" min="240" step="any" required></label><label>高度<input id="boardZoneHeight" type="number" min="200" step="any" required></label></div><p id="boardZoneError" role="alert"></p></div><menu><button type="button" id="boardZoneCancel">取消</button><button type="submit">保存结界</button></menu></form></dialog>
<dialog id="boardStyleDialog" aria-labelledby="boardStyleHeading"><form id="boardStyleForm"><header><h2 id="boardStyleHeading">调整样式</h2><button type="button" data-close-style aria-label="关闭样式设置">×</button></header><p>所有档案与连线使用统一默认样式；只有在这里保存后才会改变。</p><div id="boardStyleFields"></div><div id="boardStylePreview" aria-label="样式预览"></div><p id="boardStyleError" role="alert"></p><menu><button type="button" id="boardStyleReset">恢复默认</button><button type="button" data-close-style>取消</button><button type="submit">保存样式</button></menu></form></dialog><dialog id="boardDeleteDialog"><h2>移除这份记录？</h2><p id="boardDeleteText"></p><menu><button id="boardKeep">保留</button><button id="boardConfirmDelete">确认移除</button></menu></dialog>
<script src="caseboard-seed.js?v=2"></script><script src="caseboard-core.js?v=7-map-links"></script><script src="caseboard-style.js?v=1"></script><script src="caseboard-portraits.js?v=1"></script><script src="map-save-core.js?v=2"></script><script src="board-map-links.js?v=1"></script><script src="caseboard.js?v=7-map-links"></script><script src="cloud-config.js?v=20260915-archive2"></script><script src="assets/vendor/supabase.js"></script><script src="archive-core.js?v=3"></script><script src="archive-client.js?v=6-map-links"></script><script src="./tower-navigation.js?v=5"></script></body></html>

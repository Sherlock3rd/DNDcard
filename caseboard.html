<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>案件板 · The Black Tower</title><script src="owner-entry.js?v=1"></script><link rel="stylesheet" href="caseboard.css?v=1"><link rel="stylesheet" href="archive.css?v=1"></head>
<body><main class="case-frame"><header><div class="case-brand"><h1>案件板</h1><small>THE BLACK TOWER · 线索与人物</small></div><nav aria-label="案件板工具"><a href="index.html#portal">返回书房</a><a href="map.html">地图桌</a><button id="boardEdit" aria-pressed="false" disabled>编辑模式</button><button id="boardNew" hidden>新建人物</button><button id="boardConnect" aria-pressed="false" hidden>连线</button><button id="boardFit">全览</button><button id="boardMinus" aria-label="缩小">−</button><button id="boardPlus" aria-label="放大">＋</button><button id="boardFullscreen" aria-pressed="false">全屏</button></nav></header>
<section id="boardViewport" aria-label="可拖动缩放的案件板" tabindex="0" inert><div id="boardWorld"><div class="board-inscription" aria-hidden="true">线索终将相逢<span>THE BLACK TOWER</span></div><svg id="boardThreads" viewBox="0 0 1800 1200" aria-label="人物间的连线"></svg><div id="boardSeals"></div><div id="boardNodes"></div></div><p id="boardHint" role="status">正在展开案件板…</p></section>
<aside id="boardDetails" hidden aria-label="选中档案"><div class="detail-heading"><button id="boardCloseDetails" aria-label="关闭档案">×</button><small id="boardDetailKind"></small><h2 id="boardDetailTitle"></h2><div id="boardDetailActions"><button id="boardModify" hidden>编辑资料</button><button id="boardRemove" hidden>移除</button></div></div><div id="boardDetailBody"></div></aside>
<footer><span>肖像、封签与牵连的细线</span><button data-open-archive data-archive-status>读取最新档案…</button></footer></main>
<dialog id="boardPersonDialog" aria-labelledby="boardPersonHeading"><form id="boardPersonForm"><header><h2 id="boardPersonHeading">新建人物</h2><button type="button" data-close-person aria-label="关闭人物编辑">×</button></header><div class="form-scroll"><label>姓名<input id="boardName" maxlength="100" required></label><div class="form-pair"><label>种族<input id="boardRace" maxlength="100"></label><label>身份 / 职业<input id="boardRole" maxlength="100"></label></div><label>当前状态<input id="boardStatus" maxlength="100" placeholder="例如：失踪、已救援、已故"></label><label>人物备注<textarea id="boardNotes" maxlength="4000" rows="4"></textarea></label><details><summary>肖像资料 · 可稍后补全</summary><p>没有肖像也可以先入档。记下外貌，之后在工作台补全绘制。</p><label>外貌描述<textarea id="boardAppearance" maxlength="2000" rows="3"></textarea></label><label>已绘制的肖像文件<input id="boardPortrait" maxlength="500" placeholder="assets/images/…"></label></details><p id="boardPersonError" role="alert"></p></div><menu><button type="button" data-close-person>取消</button><button type="submit">保存人物</button></menu></form></dialog>
<dialog id="boardEdgeDialog" aria-labelledby="boardEdgeHeading"><form id="boardEdgeForm"><h2 id="boardEdgeHeading">连线备注</h2><p id="boardEdgeNames"></p><label>关系、证词或疑点<textarea id="boardEdgeNote" maxlength="2000" rows="6" placeholder="记录他们之间已知的牵连…"></textarea></label><menu><button type="button" id="boardCancelEdge">取消</button><button type="submit">保存连线</button></menu></form></dialog>
<dialog id="boardDeleteDialog"><h2>移除这份记录？</h2><p id="boardDeleteText"></p><menu><button id="boardKeep">保留</button><button id="boardConfirmDelete">确认移除</button></menu></dialog>
<script src="caseboard-seed.js?v=1"></script><script src="caseboard-core.js?v=1"></script><script src="caseboard.js?v=1"></script><script src="cloud-config.js?v=20260915-archive2"></script><script src="assets/vendor/supabase.js"></script><script src="archive-core.js?v=3"></script><script src="archive-client.js?v=4"></script></body></html>

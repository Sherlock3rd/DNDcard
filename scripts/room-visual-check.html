<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原图图层验收</title><link rel="stylesheet" href="../room.css"><style>body{margin:0;background:#16191e;color:#eee;font:14px sans-serif}.room-object{display:none}.study-room{height:720px}.room-stage{width:1279.32px;height:720px}.room-viewport{overflow:hidden}#comparison{position:relative;width:1279.32px;height:720px}#original{position:absolute;inset:0;width:100%;height:100%;z-index:9;pointer-events:none;mix-blend-mode:difference}#comparison[data-mode="layers"] #original{display:none}#comparison[data-mode="original"] .room-artwork{visibility:hidden}#comparison[data-mode="original"] #original{mix-blend-mode:normal}nav{padding:12px;display:flex;gap:10px}button{padding:10px}pre{white-space:pre-wrap}</style><nav><button data-mode="layers">拆分图层</button><button data-mode="original">原图</button><button data-mode="difference">差异图（应接近纯黑）</button></nav><div id="comparison" data-mode="difference" class="study-room"></div><pre id="report">正在检查…</pre><script src="../assets/images/room/layout.js"></script><script src="../room.js"></script><script>
const box=document.getElementById('comparison');box.innerHTML=renderOriginalRoomLayers(3).replaceAll('./assets/','../assets/')+'<img id="original" src="../assets/images/room/source.png">';document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{if(b.tagName==='BUTTON')box.dataset.mode=b.dataset.mode}));
Promise.all([...box.querySelectorAll('img')].map(i=>i.decode())).then(()=>{
 const original=box.querySelector('#original'), layers=[...box.querySelectorAll('.room-layer')], results=[];
 for(const width of [1672,1279,693,1500]){
  const height=Math.round(width*941/1672), a=document.createElement('canvas'), b=document.createElement('canvas');a.width=b.width=width;a.height=b.height=height;
  const ac=a.getContext('2d'), bc=b.getContext('2d');ac.drawImage(original,0,0,width,height);bc.globalCompositeOperation='lighter';for(const layer of layers)bc.drawImage(layer,0,0,width,height);
  const reference=ac.getImageData(0,0,width,height).data, actual=bc.getImageData(0,0,width,height).data;let max=0,sum=0,over3=0;
  for(let i=0;i<reference.length;i++){const d=Math.abs(reference[i]-actual[i]);max=Math.max(max,d);sum+=d;if(d>3)over3++}
  results.push({size:[width,height],maximumChannelDifference:max,meanChannelDifference:sum/reference.length,channelsAbove3:over3});
 }
 document.getElementById('report').textContent=JSON.stringify({pass:results.every(r=>r.channelsAbove3===0&&r.meanChannelDifference<.02),results},null,2);
}).catch(e=>document.getElementById('report').textContent=e.message);
</script></html>

<dialog id="entryEditor" aria-labelledby="editorTitle"><form id="entryForm"><div class="contents-heading"><h2 id="editorTitle">补记这一页</h2><button type="button" data-cancel-edit aria-label="关闭编辑">×</button></div><div class="form-row"><label>篇章名<input id="entryTitle" maxlength="100" required></label><label>日期 / 旅程日<input id="entryDay" maxlength="100" placeholder="例如：出奔之日 · 日期待记" required></label></div><label>甘道夫的记录<textarea id="entryBody" rows="12" maxlength="30000" required></textarea></label><label>关联地点<select id="entryPlace"><option value="">不关联地点</option></select></label><details><summary>原始团录与插画</summary><label>全团视角原文<textarea id="entrySource" rows="5" maxlength="40000"></textarea></label><label>章节配图地址<input id="entryImage" maxlength="500" placeholder="assets/images/journal/… 或 HTTPS 图片地址"></label><p>保留原文便于下一次转录与补图；此处编辑不会自行编造未记录的事件。</p></details><p id="editorError" role="alert"></p><menu><button type="button" data-cancel-edit>取消</button><button type="submit">写入日志</button></menu></form></dialog>
<dialog id="placeLinkDialog" aria-labelledby="placeLinkTitle"><form id="placeLinkForm"><div class="contents-heading"><h2 id="placeLinkTitle">关联地图棋子</h2><button type="button" data-close-place-link aria-label="关闭地点关联">×</button></div><p class="link-place-name" id="linkPlaceName"></p><p id="linkPlaceNote"></p><p id="linkPlaceScope"></p><label>搜索棋子<input id="pieceSearch" type="search" placeholder="输入地图上的名称或类型" autocomplete="off"></label><div class="piece-list-heading"><span id="pieceSearchResult" role="status"></span><button id="refreshPieces" type="button">刷新棋子</button></div><label>已有地图棋子<select id="existingPiece" size="6" aria-label="已有地图棋子"></select></label><p id="selectedPieceName"></p><p id="pieceLinkError" role="alert"></p><p class="link-place-hint">关联后跟随棋子位置；解除关联会保留最后落点，不删除棋子。</p><menu><button type="button" id="unlinkPiece" hidden>解除关联</button><button type="button" data-close-place-link>取消</button><button type="submit" id="linkPieceSubmit" disabled>关联此棋子</button></menu></form></dialog>
